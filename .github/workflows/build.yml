name: build

# Produces both executables, because PyInstaller cannot cross-compile: the
# ARM64 build has to run on an ARM64 machine with ARM64 Python.
#
# The windows-11-arm runner is free for public repositories only. In a private
# repository the arm64 job will fail to start, so build that one on a real
# Windows on ARM device with: python build.py --clean --arch arm64

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  executable:
    name: word2md-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}

      - name: Show the interpreter
        run: python -c "import platform, sys; print(platform.machine(), sys.version)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Test
        run: python -m unittest discover -s tests -t tests -p "test_*.py"

      # --arch refuses to run on a mismatched interpreter, and the result is
      # checked against its own PE header afterwards.
      - name: Build
        run: python build.py --clean --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: word2md-${{ matrix.arch }}
          path: dist/word2md-${{ matrix.arch }}.exe
          if-no-files-found: error

  # Linux x64 ELF binary. Built on the oldest supported Ubuntu runner so the
  # glibc it links against is old enough for most current distributions.
  linux:
    name: word2md-linux-x64
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: System packages (Tk, OCR, LibreOffice for .doc/.pdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tesseract-ocr tesseract-ocr-vie \
            libreoffice-writer-nogui fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Test
        run: python -m unittest discover -s tests -t tests -p "test_*.py"

      - name: Build
        run: python build.py --clean --arch x64

      - uses: actions/upload-artifact@v7
        with:
          name: word2md-linux-x64
          # The bare binary is what the in-app updater downloads; the .tar.gz
          # (binary + .sha256 + install-linux.sh) is what people download.
          path: |
            dist/word2md-linux-x64
            dist/word2md-linux-x64.tar.gz
          if-no-files-found: error

  # Only on a tag, and only once both executables exist: a release missing an
  # architecture is worse than no release at all.
  release:
    name: Publish release
    needs: [executable, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7  # for CHANGELOG.md

      - uses: actions/download-artifact@v7
        with:
          pattern: word2md-*
          merge-multiple: true
          path: dist

      # The in-app updater verifies the download against these before it
      # replaces the running executable.
      - name: Checksums
        run: |
          cd dist
          for exe in *.exe word2md-linux-*; do
            case "$exe" in *.sha256) continue ;; esac
            sha256sum "$exe" > "$exe.sha256"
          done
          cat *.sha256

      # The release notes are the tag's own section of CHANGELOG.md, so what a
      # release says is written and reviewed with the code it ships.
      - name: Release notes
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" '
            index($0, heading) == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            cat notes.md
          else
            echo "::warning::CHANGELOG.md has no section for $GITHUB_REF_NAME"
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if [ -s notes.md ]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/word2md-linux-x64 dist/word2md-linux-x64.tar.gz dist/*.sha256 \
            --title "word2md $GITHUB_REF_NAME" \
            "${notes[@]}"
